services:
  - type: web
    name: safe-space-saturdays
    runtime: docker
    plan: free
    repo: https://github.com/The-Azure-Coder/safe-space-saturdays.git
    branch: mono-repo
    autoDeployTrigger: commit
    dockerfilePath: ./Dockerfile.monorepo
    dockerContext: .
    healthCheckPath: /
    envVars:
      - key: APP_ENV
        value: production
      - key: COOKIE_SECURE
        value: "true"
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: API_CORS_ORIGINS
        sync: false
      - key: UPLOAD_DIR
        value: ./uploads
      - key: MAX_UPLOAD_BYTES
        value: "10000000"
      - key: MAX_SOURCE_UPLOAD_BYTES
        value: "40000000"
      - key: USE_CLOUDINARY
        value: "true"
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: GOOGLE_OAUTH_ENABLED
        sync: false
      - key: GOOGLE_OAUTH_CLIENT_ID
        sync: false
      - key: GOOGLE_OAUTH_CLIENT_SECRET
        sync: false
      - key: GOOGLE_OAUTH_REDIRECT_URI
        sync: false
      - key: VITE_API_URL
        value: http://127.0.0.1:8000
