[project]
name = "safe-space-saturdays-api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "alembic==1.18.5",
  "email-validator==2.3.0",
  "fastapi==0.139.0",
  "psycopg[binary]==3.3.4",
  "pydantic-settings==2.14.2",
  "python-multipart==0.0.22",
  "redis[hiredis]==6.4.0",
  "sqlalchemy==2.0.51",
  "uvicorn[standard]==0.51.0",
]

[build-system]
requires = ["hatchling==1.31.0"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
  "httpx2==2.5.0",
  "mypy==2.2.0",
  "pytest==9.1.1",
  "pytest-asyncio==1.4.0",
  "ruff==0.15.21",
]

[tool.hatch.build.targets.wheel]
packages = ["src/app"]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]
plugins = ["pydantic.mypy"]
