services:
  db:
    image: postgres:18.4-alpine
    environment:
      # Keep local Docker credentials isolated from the production .env file.
      # The API below connects with these same values.
      POSTGRES_DB: app
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d app"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres-data:/var/lib/postgresql

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - redis-data:/data

  api:
    build:
      context: ./api
    environment:
      APP_ENV: development
      DATABASE_URL: postgresql+psycopg://app:app@db:5432/app
      REDIS_URL: redis://redis:6379/0
      API_CORS_ORIGINS: '["http://localhost:3000","http://127.0.0.1:3000"]'
      COOKIE_SECURE: "false"
      PORT: "8000"
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      - ./api:/app
      - api-uploads:/app/uploads
      - api-venv:/app/.venv
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/live')"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build:
      context: ./web
    environment:
      VITE_API_URL: http://localhost:${API_PORT:-8000}
      CHOKIDAR_USEPOLLING: "true"
      PORT: "3000"
    command: npm run dev -- --host 0.0.0.0
    ports:
      - "${WEB_PORT:-3000}:3000"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:3000/assets/safe-space-saturdays-logo.jpeg').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))\""]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    volumes:
      - ./web:/app
      - web-node-modules:/app/node_modules
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres-data:
  redis-data:
  api-venv:
  web-node-modules:
  api-uploads:
