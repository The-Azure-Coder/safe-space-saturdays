services:
  db:
    image: postgres:18.4-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-app}
      POSTGRES_USER: ${POSTGRES_USER:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-app}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres-data:/var/lib/postgresql

  api:
    build:
      context: ./api
    environment:
      APP_ENV: development
      DATABASE_URL: postgresql+psycopg://app:app@db:5432/app
      API_CORS_ORIGINS: '["http://localhost:3000","http://127.0.0.1:3000"]'
      COOKIE_SECURE: "false"
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      - ./api:/app
      - api-venv:/app/.venv
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/live')"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build:
      context: ./web
    environment:
      VITE_API_URL: http://localhost:${API_PORT:-8000}
      CHOKIDAR_USEPOLLING: "true"
    ports:
      - "${WEB_PORT:-3000}:3000"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:3000/assets/safe-space-saturdays-logo.jpeg').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))\""]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    volumes:
      - ./web:/app
      - web-node-modules:/app/node_modules
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres-data:
  api-venv:
  web-node-modules:
